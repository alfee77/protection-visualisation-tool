<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <title>Protection App</title>
  </head>
  <body>
    <nav id="navbar">
      <h1 class="nav-brand">Circuit Protection Visualisation Tool V1.0.0</h1>
      <ul>
        <li class="nav-item">
          <a href="../">Circuit Viewer</a>
        </li>
        <li class="nav-item">
          <a href="/circuit_builder">Circuit Builder</a>
        </li>
      </ul>
    </nav>

    <div class="container" id="main">
      <!-- <div id="app"></div> -->
      <form id="create-form">
        <h2>Select Circuit & Relaying Point</h2>
        <div class="label-wrap">
          <label for="select-circuit">Select a circuit:</label>
          <select id="select-circuit">
            <option id="default" value="">Please select</option>
          </select>
        </div>

        <div class="label-wrap">
          <label for="select-relay-point">Select a relaying point:</label>
          <select id="select-relay-point">
            <option id="default" value="">Please select</option>
          </select>
        </div>

        <div class="label-wrap">
          <button id="draw-circuit-btn" class="btn btn-default">
            Draw Circuit
          </button>
        </div>
      </form>

      <div><canvas id="chart" width="100px" height="100px"></canvas></div>
      <script type="module" src="/src/circuitViewer.js"></script>
    </div>
  </body>
</html>
